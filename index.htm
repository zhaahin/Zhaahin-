<!DOCTYPE html>
<html lang="so">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boggayga Tijaabada</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #101d3a, #2855a6);
      color: white;
      text-align: center;
      padding: 50px 20px;
      margin: 0;
    }

    .card {
      background: white;
      color: #172554;
      padding: 30px 20px;
      border-radius: 20px;
      max-width: 400px;
      margin: 30px auto;
      box-shadow: 0 8px 25px #0004;
    }

    h1 {
      font-size: 30px;
    }

    p {
      font-size: 17px;
      line-height: 1.6;
    }

    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 14px 25px;
      border-radius: 10px;
      font-size: 17px;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>🎉 Soo dhawoow!</h1>

    <p>
      Kani waa boggaygii an ugu talagalay in an ku jabsado whatsppka facebook snapchat telegram gmail
  
    </p>

    <button onclick="salaan()">Riix halkan</button>

    <p id="fariin"></p>
  </div>

  <script>
    function salaan() {
      document.getElementById("fariin").textContent =
        "Hambalyo! Boggaagu si fiican ayuu u shaqaynayaa ❤️";
    }
  </script>
</body>
</html>
